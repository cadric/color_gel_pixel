<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seamless Texture Mixer – 20×20 grid + random tiles</title>
  <style>
    :root{
      --bg: #141414;
      --panel-bg: rgba(0,0,0,.65);
      --panel-border: rgba(255,255,255,.14);
      --panel-text: #f5f5f5;
      --accent: #74c0fc;

      --zoom: 1;          /* multiplier (1 = 100%) */
      --tile: 64;         /* px per tile (grundstørrelse) */
      --tiles-x: 20;      /* antal tiles horisontalt */
      --tiles-y: 20;      /* antal tiles vertikalt */

      --grid-color: rgba(255,255,255,.3);
      --grid-thick: 1px;
      --grid-opacity: .6;
      --stage-radius: 14px;
    }

    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--panel-text); font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, Noto Sans; }

    /* Layout: sidebar (panel) + viewport (stage) */
    .layout { display:grid; grid-template-columns: minmax(280px, 520px) 1fr; gap: 16px; align-items:start; padding: 12px; box-sizing:border-box; min-height:100vh; }
    @media (max-width: 960px){ .layout { grid-template-columns: 1fr; } }

    /* Viewport area that centers stage and prevents overlap with panel */
    .wrap { min-height: calc(100vh - 24px); display:grid; place-items:center; padding: 12px 12px 46px; box-sizing:border-box; overflow:auto; }

    /* Stage er en CSS grid med X×Y felter */
    .stage {
      position:relative;
      width: calc(var(--tiles-x) * var(--tile) * 1px * var(--zoom));
      height: calc(var(--tiles-y) * var(--tile) * 1px * var(--zoom));
      display: grid;
      grid-template-columns: repeat(var(--tiles-x), 1fr);
      grid-template-rows: repeat(var(--tiles-y), 1fr);
      box-shadow: 0 20px 60px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.06);
      border-radius: var(--stage-radius);
      overflow:hidden;
      isolation:isolate;
      background:#0000;
    }

    /* Hver tile gentager billedet i sin egen celles koordinater */
    .tile {
      background-repeat: repeat;
      background-position: 0 0; /* aligner alle til (0,0) så sømme kan afsløres mellem forskellige textures */
      /* Brug en px-variabel så vi kan runde til heltal i JS for skarphed */
      background-size: var(--tilepx) var(--tilepx);
      /* Tving nærmeste-neighbor skalering for skarpe pixels */
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      image-rendering: -moz-crisp-edges;
    }

    /* Grid overlay (kan toggles) */
    .stage.grid-on::after{
      content:""; position:absolute; inset:0; pointer-events:none; opacity: var(--grid-opacity);
      /* Normal compositing (ingen mix-blend), så grid-farven er ren */
      mix-blend-mode: normal;
      background-image:
        linear-gradient(to right, var(--grid-color) var(--grid-thick), #0000 0),
        linear-gradient(to bottom, var(--grid-color) var(--grid-thick), #0000 0);
      background-size: var(--tilepx) var(--tilepx);
      background-position: top left;
      z-index: 2;
    }

    /* Panel */
    .panel { position: sticky; top: 12px; background: var(--panel-bg); border: 1px solid var(--panel-border); backdrop-filter: blur(6px); border-radius: 14px; padding: 12px 14px; display: grid; gap: 10px; width: auto; max-width: 520px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
    .grid2 { display: grid; gap: 10px; grid-template-columns: 1fr; }
    .row { display:grid; grid-template-columns: 160px 1fr auto; align-items:center; gap:10px; }
    .row label { font-size: 12px; opacity:.85; }
    .row input[type="range"] { width:100%; }
    .row input[type="number"], .row input[type="color"] { width: 100px; background: transparent; color: var(--panel-text); border: 1px solid var(--panel-border); padding: 6px 8px; border-radius: 8px; }
    .btns { display:flex; gap:8px; flex-wrap:wrap; }
    button, .file { appearance:none; border:1px solid var(--panel-border); background:transparent; color:var(--panel-text); padding:8px 10px; border-radius:10px; cursor:pointer; font-weight:600; }
    button.primary { border-color: color-mix(in oklab, var(--accent) 70%, white 0%); }
    input[type="file"]{ display:none; }
    .file{ display:inline-flex; align-items:center; gap:.5ch; }
    .hint { text-align:center; font-size: clamp(14px, 2vw, 18px); opacity:.75; padding: 8px; }
    .foot { position: fixed; right: 12px; bottom: 10px; opacity: .5; font-size: 12px; }

    .drop-hl::after{ content:"Slip billeder her"; position: fixed; inset: 0; display: grid; place-items: center; background: rgba(116,192,252,.12); color: #e8f3ff; font-size: clamp(20px, 3vw, 36px); border: 3px dashed rgba(116,192,252,.7); border-radius: 16px; margin: 12px; z-index: 10; pointer-events: none; }
  </style>
</head>
<body>
  <div class="layout">
  <form class="panel" id="panel" onsubmit="event.preventDefault()">
    <div class="grid2">
      <div class="row">
        <label for="images">Billeder (flere tilladt)</label>
        <input id="images" type="file" accept="image/*" multiple />
        <div class="btns"><label class="file" for="images">Vælg…</label><button id="clearImgs" type="button">Ryd billeder</button><button id="reshuffle" type="button" class="primary">Reshuffle</button></div>
      </div>

      <div class="row">
        <label for="zoom">Zoom (% pr. tile)</label>
        <input id="zoom" type="range" min="25" max="400" value="100" step="1" />
        <input id="zoomNum" type="number" min="25" max="400" value="100" step="1" />
      </div>

      <div class="row">
        <label for="tile">Tile px (typisk 64)</label>
        <input id="tile" type="range" min="8" max="512" value="64" step="1" />
        <input id="tileNum" type="number" min="8" max="1024" value="64" step="1" />
      </div>

      <div class="row">
        <label>Antal tiles (X × Y)</label>
        <div class="btns" style="gap:6px">
          <input id="tilesX" type="number" min="1" max="200" value="20" step="1" />
          <input id="tilesY" type="number" min="1" max="200" value="20" step="1" />
        </div>
        <div class="btns"><button id="rebuild" type="button">Genopbyg</button></div>
      </div>

      <div class="row">
        <label>Randomisering</label>
        <div class="btns" style="gap:6px">
          <label>Seed <input id="seed" type="number" value="1" min="0" max="999999" step="1" /></label>
          <button id="applySeed" type="button">Anvend seed</button>
        </div>
        <div class="btns"><button id="reshuffle2" type="button">Reshuffle</button></div>
      </div>

      <div class="row">
        <label>Grid</label>
        <div class="btns" style="gap:6px; align-items:center">
          <label><input id="gridToggle" type="checkbox" checked /> Vis grid</label>
          <label>Farve <input id="gridColor" type="color" value="#ffffff" /></label>
          <label>Opacity <input id="gridOpacity" type="range" min="0" max="100" value="60" /></label>
          <label>Tykkelse <input id="gridThick" type="number" min="1" max="5" value="1" /> px</label>
        </div>
        <div></div>
      </div>
    </div>
  </form>
  <div class="wrap">
    <div class="stage grid-on" id="stage" aria-label="20×20 tile viewport"></div>
  </div>
  </div>

  <div class="foot">🔁 Mixer: Load flere textures → random fordelte på gridet. Drop/paste/filvalg understøttes.</div>

  <script>
    const S = {
      urls: [],       // data-URLs / eksterne URLs
      zoom: 1,        // 1 = 100%
      tile: 64,       // px pr tile
      tilesX: 20,
      tilesY: 20,
      seed: 1,
      showGrid: true,
      gridColor: '#ffffff',
      gridOpacity: .6,
      gridThick: 1
    };

    const $ = id => document.getElementById(id);
    const stage = $('stage');

    // Simple deterministisk PRNG (mulberry32)
    function rng(seed){
      let t = seed >>> 0;
      return function(){
        t += 0x6D2B79F5;
        let r = Math.imul(t ^ t >>> 15, 1 | t);
        r ^= r + Math.imul(r ^ r >>> 7, 61 | r);
        return ((r ^ r >>> 14) >>> 0) / 4294967296;
      };
    }

    function applyVars(){
      // CSS custom properties (grid overlay m.m.)
      document.documentElement.style.setProperty('--zoom', S.zoom);
      document.documentElement.style.setProperty('--tile', S.tile);
      document.documentElement.style.setProperty('--tiles-x', S.tilesX);
      document.documentElement.style.setProperty('--tiles-y', S.tilesY);
      document.documentElement.style.setProperty('--grid-color', hexToRgba(S.gridColor, 1));
      document.documentElement.style.setProperty('--grid-opacity', S.gridOpacity);
      document.documentElement.style.setProperty('--grid-thick', S.gridThick + 'px');
      stage.classList.toggle('grid-on', S.showGrid);

      // Sæt stage størrelse direkte i heltals-px (robust og skarpt)
      const tilePx = Math.round(S.tile * S.zoom);
      document.documentElement.style.setProperty('--tilepx', tilePx + 'px');
      stage.style.width  = (S.tilesX * tilePx) + 'px';
      stage.style.height = (S.tilesY * tilePx) + 'px';
      stage.style.gridTemplateColumns = `repeat(${S.tilesX}, 1fr)`;
      stage.style.gridTemplateRows    = `repeat(${S.tilesY}, 1fr)`;

      // Tving hver tile til at bruge præcis px-størrelse
      const tiles = stage.querySelectorAll('.tile');
      tiles.forEach(t => { t.style.backgroundSize = tilePx + 'px ' + tilePx + 'px'; });

      // Synk UI
      $('zoom').value = Math.round(S.zoom * 100);
      $('zoomNum').value = Math.round(S.zoom * 100);
      $('tile').value = S.tile;
      $('tileNum').value = S.tile;
      $('tilesX').value = S.tilesX;
      $('tilesY').value = S.tilesY;
    }

    function hexToRgba(hex){
      // Support #rgb eller #rrggbb
      let h = hex.replace('#','');
      if (h.length===3) h = h.split('').map(x=>x+x).join('');
      const r=parseInt(h.slice(0,2),16), g=parseInt(h.slice(2,4),16), b=parseInt(h.slice(4,6),16);
      return `rgba(${r},${g},${b},1)`;
    }

    function buildTiles(){
      stage.innerHTML='';
      const total = S.tilesX * S.tilesY;
      const pick = rng(S.seed);
      const tilePx = Math.round(S.tile * S.zoom);
      for (let i=0;i<total;i++){
        const d = document.createElement('div');
        d.className = 'tile';
        d.style.backgroundSize = tilePx + 'px ' + tilePx + 'px';
        if (S.urls.length){
          const url = S.urls[Math.floor(pick()*S.urls.length)];
          d.style.backgroundImage = `url('${url}')`;
        }
        stage.appendChild(d);
      }
    }

    function reshuffle(){
      // reassign images uden at rebuild DOM
      const tiles = stage.querySelectorAll('.tile');
      const pick = rng(S.seed);
      tiles.forEach(t=>{
        if (S.urls.length){
          const url = S.urls[Math.floor(pick()*S.urls.length)];
          t.style.backgroundImage = `url('${url}')`;
        } else {
          t.style.backgroundImage = 'none';
        }
      });
    }

    function readFiles(files){
      const list = Array.from(files||[]).filter(f=>f.type && f.type.startsWith('image/'));
      if (!list.length) return;
      const pending = list.length;
      let done = 0;
      list.forEach(file=>{
        const reader = new FileReader();
        reader.onload = e => { S.urls.push(e.target.result); if (++done===pending){ reshuffle(); } };
        reader.readAsDataURL(file);
      });
    }

    // Events: UI
    $('images').addEventListener('change', e=>{ readFiles(e.target.files); e.target.value=''; });

    $('clearImgs').addEventListener('click', ()=>{ S.urls=[]; reshuffle(); });
    const doZoom = val => { S.zoom = Math.max(.01, val/100); applyVars(); };
    $('zoom').addEventListener('input', ()=>{ doZoom($('zoom').value); });
    $('zoomNum').addEventListener('input', ()=>{ doZoom($('zoomNum').value); });
    const doTile = val => { S.tile = parseInt(val,10)||64; applyVars(); };
    $('tile').addEventListener('input', ()=>{ doTile($('tile').value); });
    $('tileNum').addEventListener('input', ()=>{ doTile($('tileNum').value); });
    $('tilesX').addEventListener('input', ()=>{ S.tilesX = Math.max(1, parseInt($('tilesX').value,10)||20); applyVars(); });
    $('tilesY').addEventListener('input', ()=>{ S.tilesY = Math.max(1, parseInt($('tilesY').value,10)||20); applyVars(); });
    $('rebuild').addEventListener('click', ()=> buildTiles());

    // Randomisering controls
    $('seed').addEventListener('input', ()=>{ const s = parseInt($('seed').value,10); if (!Number.isNaN(s)) S.seed = s; });
    $('applySeed').addEventListener('click', ()=>{ reshuffle(); });
    $('reshuffle').addEventListener('click', ()=>{ S.seed = (S.seed+1) % 1000000; $('seed').value = S.seed; reshuffle(); });
    $('reshuffle2').addEventListener('click', ()=>{ S.seed = (S.seed+1) % 1000000; $('seed').value = S.seed; reshuffle(); });

    // Grid controls
    $('gridToggle').addEventListener('change', ()=>{ S.showGrid = $('gridToggle').checked; applyVars(); });
    $('gridColor').addEventListener('input', ()=>{ S.gridColor = $('gridColor').value; applyVars(); });
    $('gridOpacity').addEventListener('input', ()=>{ S.gridOpacity = parseInt($('gridOpacity').value,10)/100; applyVars(); });
    $('gridThick').addEventListener('input', ()=>{ S.gridThick = parseInt($('gridThick').value,10)||1; applyVars(); });

    // Drag & drop (understøtter flere filer + URL'er)
    const dragHL = () => document.body.classList.add('drop-hl');
    const dragOff = () => document.body.classList.remove('drop-hl');
    ;['dragenter','dragover'].forEach(ev=>window.addEventListener(ev, (e)=>{ e.preventDefault(); dragHL(); }));
    ;['dragleave','drop'].forEach(ev=>window.addEventListener(ev, (e)=>{ e.preventDefault(); dragOff(); }));
    window.addEventListener('drop', (e)=>{
      const files = e.dataTransfer.files;
      if (files && files.length){ readFiles(files); return; }
      // Fald tilbage: URL'er adskilt med linjeskift eller mellemrum
      const txt = e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain');
      if (txt){
        const urls = txt.split(/\s+/).filter(x=>/^https?:\/\//i.test(x));
        if (urls.length){ S.urls.push(...urls); reshuffle(); }
      }
    });

    // Paste: billedet fra clipboard eller URL'er
    window.addEventListener('paste', (e)=>{
      const items = e.clipboardData?.items || [];
      let used = false;
      for (const it of items){
        if (it.type && it.type.startsWith('image/')){ readFiles([it.getAsFile()]); used = true; }
      }
      if (!used){
        const txt = e.clipboardData?.getData('text') || '';
        const urls = txt.split(/\s+/).filter(x=>/^https?:\/\//i.test(x));
        if (urls.length){ S.urls.push(...urls); reshuffle(); }
      }
      if (used) e.preventDefault();
    });

    // Alt+scroll = zoom
    window.addEventListener('wheel', (e)=>{
      if (!e.altKey) return;
      e.preventDefault();
      const cur = Math.round(S.zoom * 100);
      const next = Math.min(400, Math.max(25, cur - Math.sign(e.deltaY)));
      S.zoom = next/100; $('zoom').value = next; $('zoomNum').value = next; applyVars();
    }, { passive:false });

    // Init
    applyVars();
    buildTiles();
  </script>
</body>
</html>
